<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:252px;background:var(--navy);color:#fff;padding:22px 14px;display:flex;flex-direction:column;z-index:30;transition:.25s;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 26px}.logo{width:40px;height:40px;border-radius:13px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:20px;font-weight:900}.brand strong{display:block;font-size:18px;letter-spacing:.2px}.brand small{color:#aebdd0;font-size:11px}.nav-label{color:#8295ac;font-size:10px;font-weight:800;letter-spacing:1.2px;padding:15px 12px 7px}.nav button{width:100%;border:0;background:transparent;color:#c7d2df;padding:11px 12px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:12px;margin:2px 0}.nav button:hover,.nav button.active{background:#314c6b;color:#fff}.nav .ico{width:19px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;background:#213b58;border-radius:13px;padding:13px;color:#d5dfeb;font-size:12px}.main{margin-left:252px;min-height:100vh;transition:.25s}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:15}.top-left{display:flex;align-items:center;gap:14px}.menu-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px}.topbar .sub{color:var(--muted);font-size:12px}.user-pill{background:#f1f4f8;padding:8px 12px;border-radius:30px;font-size:12px;color:#43536a}.content{max-width:1450px;margin:auto;padding:28px 30px 50px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:22px}.page-head h1{font-size:25px;margin:0 0 4px;letter-spacing:-.5px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat .symbol{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;font-size:18px}.symbol.green{background:#e7f6ef;color:var(--green)}.symbol.red{background:#fff0ef;color:var(--red)}.symbol.blue{background:#eaf1fb;color:var(--blue)}.symbol.gold{background:#fbf4e5;color:var(--amber)}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:22px;font-weight:800;margin-top:8px;letter-spacing:-.5px}.hero{background:linear-gradient(120deg,#1a3554,#294b70);color:#fff;border-radius:18px;padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow)}.hero-top{display:flex;justify-content:space-between;align-items:center;color:#cbd8e6;font-size:12px}.hero-amount{font-size:32px;font-weight:800;letter-spacing:-1px;margin:8px 0 14px}.hero-foot{display:flex;gap:40px;border-top:1px solid #ffffff25;padding-top:13px}.hero-foot span{display:block;color:#cbd8e6;font-size:11px}.hero-foot b{font-size:14px}.cols{grid-template-columns:1.25fr .9fr}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-title h3{margin:0;font-size:15px}.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:650;background:var(--navy2);color:#fff}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#edf1f6;color:#334155}.btn.danger{background:#fff0ef;color:var(--red)}.btn.success{background:#e7f6ef;color:var(--green)}.btn.gold{background:var(--gold);color:#17283e}.btn.smallbtn{padding:6px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:14px 8px;color:#34445a;font-weight:650}.quick button span{display:block;font-size:20px;margin-bottom:5px}.progress{height:9px;background:#edf0f4;border-radius:20px;overflow:hidden}.progress i{height:100%;display:block;background:var(--green);border-radius:20px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-title{font-weight:650}.tag{font-size:11px;border-radius:30px;padding:4px 8px;background:#eef2f6;color:#536276;white-space:nowrap}.tag.green{background:#e7f6ef;color:var(--green)}.tag.red{background:#fff0ef;color:var(--red)}.tag.amber{background:#fff5df;color:#98630f}.tag.blue{background:#eaf1fb;color:var(--blue)}.empty{text-align:center;color:var(--muted);padding:25px 10px}.empty b{display:block;color:#43536a;margin-bottom:4px}.barline{display:flex;align-items:center;gap:10px;margin:12px 0}.barline label{width:90px;font-size:12px;color:var(--muted)}.barline .track{flex:1;height:9px;background:#edf0f4;border-radius:20px;overflow:hidden}.barline .track i{display:block;height:100%;border-radius:20px}.barline strong{width:105px;text-align:right;font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{max-width:230px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:#526174;font-weight:650}.field input,.field select,.toolbar input,.toolbar select{border:1px solid #dce2e9;border-radius:9px;padding:10px 11px;background:#fff;color:var(--text);width:100%;outline:none}.field input:focus,.field select:focus{border-color:#7192b5;box-shadow:0 0 0 3px #376a9e15}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-weight:700;background:#fafbfc}td strong{font-size:13px}.positive{color:var(--green)}.negative{color:var(--red)}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dayname{text-align:center;color:var(--muted);font-size:11px;padding:8px}.day{min-height:90px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px;font-size:12px}.day.mutedday{background:#f8f9fb;color:#b2bac5}.day.today{border:2px solid #4d789f}.daynum{font-weight:750}.event{font-size:10px;padding:3px 5px;border-radius:5px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#eaf1fb;color:#376a9e}.event.income{background:#e7f6ef;color:#16845b}.event.bill{background:#fff0ef;color:#c04444}.event.work{background:#fff5df;color:#98630f}.modal-back{position:fixed;inset:0;background:#10182880;z-index:80;display:none;align-items:center;justify-content:center;padding:18px}.modal-back.show{display:flex}.modal{background:#fff;border-radius:17px;padding:22px;width:min(570px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h3{margin:0}.close{border:0;background:#f1f3f6;border-radius:8px;padding:6px 10px}.toast{position:fixed;right:22px;bottom:22px;background:#172c46;color:#fff;padding:12px 18px;border-radius:10px;z-index:100;box-shadow:var(--shadow);display:none}.toast.show{display:block}.mobile-overlay{display:none}
body.collapsed .sidebar{width:76px}body.collapsed .brand div:last-child,body.collapsed .nav-label,body.collapsed .nav button .navtext,body.collapsed .side-bottom{display:none}body.collapsed .brand{padding:0 4px 26px}body.collapsed .nav button{justify-content:center}body.collapsed .main{margin-left:76px}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{transform:translateX(-100%);width:260px}body.mobile-open .sidebar{transform:translateX(0)}body.collapsed .sidebar{width:260px}body.collapsed .brand div:last-child,body.collapsed .nav-label,body.collapsed .nav button .navtext,body.collapsed .side-bottom{display:block}body.collapsed .nav button{justify-content:flex-start}.main,body.collapsed .main{margin-left:0}.mobile-overlay{position:fixed;inset:0;background:#10182870;z-index:20}.mobile-overlay.show{display:block}.topbar{height:62px;padding:0 15px}.content{padding:20px 14px 35px}.page-head h1{font-size:22px}.stats{gap:10px}.card{padding:14px}.stat .value{font-size:18px}.hero{padding:18px}.hero-amount{font-size:27px}.hero-foot{gap:20px}.quick{gap:7px}.quick button{font-size:11px;padding:11px 4px}.form-grid{grid-template-columns:1fr}.day{min-height:65px;padding:4px}.event{font-size:8px;padding:2px}.calendar{gap:3px}.dayname{font-size:10px}.user-pill{display:none}}
</style></head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">A</div><div><strong>AMAL Finance</strong><small>Personal Finance Manager</small></div></div>
 <nav class="nav">
  <div class="nav-label">UTAMA</div>
  <button class="active" data-page="dashboard"><span class="ico">▦</span><span class="navtext">Dashboard</span></button>
  <button data-page="calendar"><span class="ico">▣</span><span class="navtext">Kalender</span></button>
  <button data-page="transactions"><span class="ico">⇄</span><span class="navtext">Transaksi</span></button>
  <div class="nav-label">KEUANGAN</div>
  <button data-page="income"><span class="ico">↗</span><span class="navtext">Pemasukan</span></button>
  <button data-page="expense"><span class="ico">↘</span><span class="navtext">Pengeluaran</span></button>
  <button data-page="bills"><span class="ico">▤</span><span class="navtext">Utang & Tagihan</span></button>
  <button data-page="planning"><span class="ico">◷</span><span class="navtext">Rencana Keuangan</span></button>
  <button data-page="sources"><span class="ico">＋</span><span class="navtext">Sumber & Kategori</span></button>
  <div class="nav-label">ANALISIS</div>
  <button data-page="reports"><span class="ico">▥</span><span class="navtext">Laporan</span></button>
 </nav>
 <div class="side-bottom">✦ <b>Keuangan lebih tertata</b><br>Rencanakan hari ini, siapkan masa depan.</div>
</aside>
<div class="mobile-overlay" id="overlay"></div>
<main class="main">
 <header class="topbar"><div class="top-left"><button class="menu-btn" id="menuBtn">☰</button><div><b id="topTitle">Dashboard</b><div class="sub">Kelola keuangan dengan lebih terencana</div></div></div><div class="user-pill">◉ Keuangan Pribadi</div></header>
 <div class="content" id="content"></div>
</main></div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Tambah data</h3><button class="close" id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), money=n=>'Rp '+Math.round(Number(n)||0).toLocaleString('id-ID'), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, uid=()=>Date.now()+Math.floor(Math.random()*999);
const defaultState={transactions:[],debts:[],plans:[],events:[],sources:['Gaji','Honor mengajar','Usaha','Penjualan buku','Lainnya'],categories:['Kebutuhan rumah','Transportasi','Makan','Listrik','Air','Internet','Pendidikan','Kesehatan','Lainnya'],savings:0,savingTarget:30000000,savingPercent:20,openingBalance:0};
let state={...defaultState,...JSON.parse(localStorage.getItem('amalFinanceData')||'{}')};
state.transactions=Array.isArray(state.transactions)?state.transactions:[];
state.plans=Array.isArray(state.plans)?state.plans:[];
const migratedFuture=state.transactions.filter(x=>x.date>today());
if(migratedFuture.length){
 state.transactions=state.transactions.filter(x=>x.date<=today());
 migratedFuture.forEach(x=>state.plans.push({id:x.id,name:x.name,type:x.type,status:'Rencana',amount:x.amount,date:x.date,category:x.category||''}));
 localStorage.setItem('amalFinanceData',JSON.stringify(state));
}
let page='dashboard',calendarDate=new Date(),editId=null,dashboardMonth=today().slice(0,7);
function save(){localStorage.setItem('amalFinanceData',JSON.stringify(state))}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function sumTransactions(type){return state.transactions.filter(x=>x.type===type).reduce((a,x)=>a+Number(x.amount),0)}
function sumPlans(type){return state.plans.filter(x=>x.type===type&&x.status==='Rencana').reduce((a,x)=>a+Number(x.amount),0)}
function debtRemaining(){return state.debts.reduce((a,d)=>a+Math.max(0,d.balance),0)}
function monthlyTransactions(type,month){return state.transactions.filter(x=>x.type===type&&x.date?.slice(0,7)===month).reduce((a,x)=>a+Number(x.amount),0)}
function monthlyPlans(type,month){return state.plans.filter(x=>x.type===type&&x.date?.slice(0,7)===month&&x.status==='Rencana').reduce((a,x)=>a+Number(x.amount),0)}
function monthlyDebtMin(){return state.debts.reduce((a,d)=>a+Number(d.minimum||0),0)}
function allMonthlyIncome(){return monthlyTransactions('income',today().slice(0,7))+monthlyPlans('income',today().slice(0,7))}
function allMonthlyOut(){return monthlyTransactions('expense',today().slice(0,7))+monthlyPlans('expense',today().slice(0,7))+monthlyDebtMin()}
function fmtDate(d){if(!d)return '-';return new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function badge(status){let c=status==='Dibayar'||status==='Diterima'?'green':status==='Terlambat'?'red':status==='Sebagian'?'amber':'blue';return `<span class="tag ${c}">${status}</span>`}
function btn(label,action,cls='secondary'){return `<button class="btn ${cls} smallbtn" data-action="${action}">${label}</button>`}
function pageHead(title,sub,button=''){return `<div class="page-head"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${button}</div>`}
function stat(label,value,icon,color,sub=''){return `<div class="card"><div class="stat"><div><div class="label">${label}</div><div class="value">${value}</div><div class="muted small">${sub}</div></div><div class="symbol ${color}">${icon}</div></div></div>`}
function transactionRows(items){if(!items.length)return `<div class="empty"><b>Belum ada data</b>Tambahkan data untuk mulai mencatat.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Tanggal</th><th>Kategori</th><th>Nominal</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${items.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${fmtDate(x.date)}</td><td>${esc(x.category||'-')}</td><td class="${x.type==='income'?'positive':'negative'}"><b>${money(x.amount)}</b></td><td>${badge(x.status||'Tercatat')}</td><td>${btn('Edit','edit:'+x.id)} ${btn('Hapus','deleteTransaction:'+x.id,'danger')}</td></tr>`).join('')}</tbody></table></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function monthEnd(month){let [y,m]=month.split('-').map(Number);let last=new Date(y,m,0).getDate();return `${y}-${String(m).padStart(2,'0')}-${String(last).padStart(2,'0')}`}
function monthDistance(from,to){let [fy,fm]=from.split('-').map(Number),[ty,tm]=to.split('-').map(Number);return (ty-fy)*12+(tm-fm)}
function projectionFor(month){
 const now=today(),current=now.slice(0,7),end=monthEnd(month);
 if(month<current)month=current;
 const futureTransactions=state.transactions.filter(x=>x.date>now&&x.date<=end);
 const futureIn=futureTransactions.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0);
 const futureOut=futureTransactions.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0);
 const plans=state.plans.filter(x=>x.status==='Rencana'&&x.date>=now&&x.date<=end);
 const plannedIn=plans.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0);
 const plannedOut=plans.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0);
 let debtMinimum=0;
 const months=Math.max(1,monthDistance(current,month)+1);
 for(let i=0;i<months;i++){
   let [y,m]=current.split('-').map(Number);let idx=(m-1+i),yy=y+Math.floor(idx/12),mm=(idx%12)+1;let key=`${yy}-${String(mm).padStart(2,'0')}`;
   const paid=state.transactions.filter(x=>x.type==='expense'&&x.date?.slice(0,7)===key&&(String(x.category||'').toLowerCase().includes('cicilan utang')||String(x.name||'').toLowerCase().startsWith('pembayaran '))).reduce((a,x)=>a+Number(x.amount),0);
   debtMinimum+=Math.max(0,monthlyDebtMin()-paid);
 }
 const balance=state.openingBalance+sumTransactions('income')-sumTransactions('expense');
 return {balance,plannedIn,plannedOut,futureIn,futureOut,debtMinimum,forecast:balance+plannedIn+futureIn-plannedOut-futureOut-debtMinimum,plans};
}
function dashboard(){
 const month=dashboardMonth||today().slice(0,7),current=today().slice(0,7);
 if(month<current)dashboardMonth=current;
 const inc=monthlyTransactions('income',current),out=monthlyTransactions('expense',current),
 actualCash=state.openingBalance+sumTransactions('income')-sumTransactions('expense'),
 proj=projectionFor(dashboardMonth),
 confirmedBills=proj.plans.filter(p=>p.type==='expense').reduce((a,p)=>a+Number(p.amount),0)+Math.max(0,monthlyDebtMin()-state.transactions.filter(x=>x.type==='expense'&&x.date?.slice(0,7)===current&&String(x.category||'').toLowerCase().includes('cicilan utang')).reduce((a,x)=>a+Number(x.amount),0)),
 availableAfterBills=actualCash-confirmedBills,
 upcoming=[...state.plans.filter(p=>p.status==='Rencana'),...state.events].filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5),
 recent=[...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5),
 target=Number(state.savingTarget)||0,savePct=target?Math.min(100,state.savings/target*100):0;
 const monthLabel=new Date(dashboardMonth+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
 const distance=Math.max(0,monthDistance(current,dashboardMonth));
 return `${pageHead('Dashboard','Satu kali input, otomatis terhubung ke saldo, kalender, tagihan dan proyeksi',`<button class="btn gold" data-action="addTransaction">＋ Transaksi baru</button>`)}
<div class="card" style="margin-bottom:16px"><div class="section-title"><div><h3>Proyeksi saldo berdasarkan bulan</h3><div class="muted small">Pilih bulan untuk melihat perkiraan saldo pada akhir periode tersebut.</div></div><div style="min-width:165px"><input id="dashboardMonth" type="month" min="${current}" value="${dashboardMonth}" style="border:1px solid #dce2e9;border-radius:9px;padding:9px 10px;width:100%"></div></div><div class="muted small">Periode: <b>${monthLabel}</b> · ${distance===0?'Bulan ini':distance+' bulan ke depan'}</div></div>
<div class="hero"><div class="hero-top"><span>◈ SALDO AKTUAL TERSEDIA</span><span>Uang nyata · bukan rencana</span></div><div class="hero-amount">${money(actualCash)}</div><div class="hero-foot"><div><span>↗ Pemasukan aktual bulan ini</span><b>${money(inc)}</b></div><div><span>↘ Pengeluaran aktual bulan ini</span><b>${money(out)}</b></div><div><span>▤ Total sisa utang</span><b>${money(debtRemaining())}</b></div></div></div>
<div class="grid stats">${stat('Pemasukan aktual bulan ini',money(inc),'↗','green','Sudah diterima')}${stat('Rencana pemasukan s.d. bulan pilihan',money(proj.plannedIn+proj.futureIn),'◷','blue','Belum masuk saldo aktual')}${stat('Rencana pembayaran s.d. bulan pilihan',money(proj.plannedOut+proj.futureOut),'◷','gold','Belum dibayar')}${stat('Cicilan minimum terhitung',money(proj.debtMinimum),'▤','red','Dari bulan ini sampai periode pilihan')}</div>
<div class="grid cols"><div class="card"><div class="section-title"><h3>Proyeksi saldo akhir ${monthLabel}</h3><span class="tag blue">${distance===0?'Bulan ini':distance+' bulan ke depan'}</span></div>
<div style="font-size:30px;font-weight:850" class="${proj.forecast>=0?'positive':'negative'}">${money(proj.forecast)}</div><div class="muted small">Saldo aktual saat ini ditambah rencana pemasukan dan transaksi mendatang, dikurangi rencana pembayaran serta cicilan minimum sampai akhir bulan pilihan.</div>
<div class="row"><span class="muted">Saldo aktual saat ini</span><b>${money(proj.balance)}</b></div>
<div class="row"><span class="muted">Pemasukan yang direncanakan</span><b class="positive">+ ${money(proj.plannedIn+proj.futureIn)}</b></div>
<div class="row"><span class="muted">Pembayaran yang direncanakan</span><b class="negative">− ${money(proj.plannedOut+proj.futureOut)}</b></div>
<div class="row"><span class="muted">Cicilan minimum selama periode</span><b class="negative">− ${money(proj.debtMinimum)}</b></div>
<div class="row"><span class="muted">Estimasi saldo akhir periode</span><b class="${proj.forecast>=0?'positive':'negative'}">${money(proj.forecast)}</b></div>
${proj.forecast<0?'<p class="negative small">⚠ Proyeksi defisit. Periksa rencana pembayaran atau pemasukan.</p>':'<p class="positive small">✓ Proyeksi positif berdasarkan data dan rencana yang sudah dimasukkan.</p>'}
<div class="section-title" style="margin-top:20px"><h3>Akses cepat</h3></div><div class="quick"><button data-action="addIncome"><span>↗</span>Catat pemasukan</button><button data-action="addExpense"><span>↘</span>Catat pengeluaran</button><button data-action="addPlan"><span>◷</span>Buat rencana</button></div></div>

function planningPage(){let month=today().slice(0,7),pi=monthlyPlans('income',month),po=monthlyPlans('expense',month),actualIn=monthlyTransactions('income',month),actualOut=monthlyTransactions('expense',month),min=monthlyDebtMin(),net=actualIn+pi-actualOut-po-min,allocation=Math.max(0,net)*state.savingPercent/100;let plans=state.plans.slice().sort((a,b)=>a.date.localeCompare(b.date));return `${pageHead('Rencana Keuangan','Rencanakan pemasukan, pembayaran, tabungan dan masa depan',`<button class="btn" data-action="addPlan">＋ Tambah rencana</button>`)}

function reportsPage(){let inc=sumTransactions('income'),out=sumTransactions('expense'),net=inc-out,plannedI=sumPlans('income'),plannedO=sumPlans('expense');return `${pageHead('Laporan Keuangan','Ringkasan aktual dan rencana keuangan') }<div class="grid stats">${stat('Pemasukan aktual',money(inc),'↗','green','Sudah diterima')}${stat('Pengeluaran aktual',money(out),'↘','red','Sudah dibayar')}${stat('Selisih aktual',money(net),'◈',net>=0?'blue':'red','Pemasukan dikurangi pengeluaran')}${stat('Utang tersisa',money(debtRemaining()),'▤','gold','Belum lunas')}</div><div class="grid cols"><div class="card"><h3>Perbandingan aktual & rencana</h3><div class="barline"><label>Aktual masuk</label><div class="track"><i style="width:${Math.min(100,inc/Math.max(1,inc+plannedI)*100)}%;background:#16845b"></i></div><strong>${money(inc)}</strong></div><div class="barline"><label>Rencana masuk</label><div class="track"><i style="width:${Math.min(100,plannedI/Math.max(1,inc+plannedI)*100)}%;background:#75b99a"></i></div><strong>${money(plannedI)}</strong></div><div class="barline"><label>Aktual keluar</label><div class="track"><i style="width:${Math.min(100,out/Math.max(1,out+plannedO)*100)}%;background:#d04444"></i></div><strong>${money(out)}</strong></div><div class="barline"><label>Rencana keluar</label><div class="track"><i style="width:${Math.min(100,plannedO/Math.max(1,out+plannedO)*100)}%;background:#e5a09a"></i></div><strong>${money(plannedO)}</strong></div></div><div class="card"><h3>Ringkasan target</h3><div class="row"><span>Saldo tabungan</span><b>${money(state.savings)}</b></div><div class="row"><span>Target tabungan</span><b>${money(state.savingTarget)}</b></div><div class="row"><span>Progres</span><b>${state.savingTarget?(state.savings/state.savingTarget*100).toFixed(1):0}%</b></div><div class="row"><span>Rencana belum terealisasi</span><b>${state.plans.filter(p=>p.status==='Rencana').length}</b></div><button class="btn secondary" style="margin-top:12px" data-action="expo function calendarPage(){let y=calendarDate.getFullYear(),m=calendarDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells=[];for(let i=0;i<42;i++){let d=i-start+1,dt=d<1?new Date(y,m-1,prev+d):d>days?new Date(y,m+1,d-days):new Date(y,m,d),iso=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`,other=dt.getMonth()!==m,ev=[...state.events,...state.plans].filter(x=>x.date===iso);cells.push(`<div class="day ${other?'mutedday':''} ${iso===today()?'today':''}"><div class="daynum">${dt.getDate()}</div>${ev.slice(0,2).map(e=>`<div class="event ${e.type==='income'?'income':e.type==='expense'?'bill':'work'}" title="${esc(e.name)}">${esc(e.name)}</div>`).join('')}${ev.length>2?`<div class="muted" style="font-size:9px">+${ev.length-2} lainnya</div>`:''}</div>`)}return `${pageHead('Kalender Keuangan','Jadwal kerja, pemasukan, pembayaran dan jatuh tempo',`<button class="btn" data-action="addEvent">＋ Tambah agenda</button>`)}<div class="card"><div class="calendar-head"><button class="btn secondary smallbtn" data-action="prevMonth">‹</button><b>${calendarDate.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><button class="btn secondary smallbtn" data-action="nextMonth">›</button></div><div class="calendar">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<div class="dayname">${x}</div>`).join('')}${cells.join('')}</div></div><div class="card" style="margin-top:16px"><div class="section-title"><h3>Agenda & rencana terdekat</h3></div>${[...state.events,...state.plans].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="row"><div><b>${esc(e.name)}</b><div class="muted small">${fmtDate(e.date)}</div></div>${badge(e.type==='income'?'Pemasukan':e.type==='expense'?'Pembayaran':e.type==='work'?'Agenda':'Rencana')}</div>`).join('')||'<div class="empty">Belum ada agenda.</div>'}</div>`}
function sourcesPage(){return `${pageHead('Sumber & Kategori','Kelola pilihan sumber pemasukan dan kategori pengeluaran')}<div class="grid cols"><div class="card"><div class="section-title"><h3>Sumber pemasukan</h3><button class="btn smallbtn" data-action="addSource">＋ Tambah</button></div>${state.sources.map((s,i)=>`<div class="row"><b>${esc(s)}</b><div>${btn('Edit','editSource:'+i)} ${btn('Hapus','deleteSource:'+i,'danger')}</div></div>`).join('')||'<div class="empty">Belum ada sumber.</div>'}</div><div class="card"><div class="section-title"><h3>Kategori pengeluaran</h3><button class="btn smallbtn" data-action="addCategory">＋ Tambah</button></div>${state.categories.map((s,i)=>`<div class="row"><b>${esc(s)}</b><div>${btn('Edit','editCategory:'+i)} ${btn('Hapus','deleteCategory:'+i,'danger')}</div></div>`).join('')||'<div class="empty">Belum ada kategori.</div>'}</div></div>`}

function debtModal(item=null){openModal(item?'Edit utang':'Tambah utang',`${field('Nama pinjaman/tagihan','fName','text',item?.name||'')}${field('Sisa pokok utang (Rp)','fBalance','number',item?.balance||'')}<div class="form-grid">${field('Bunga per tahun (%)','fRate','number',item?.rate||0)}${field('Cicilan minimum/bulan (Rp)','fMin','number',item?.minimum||0)}</div>${field('Jatuh tempo berikutnya','fDue','date',item?.due||today())}<div class="actions"><button class="btn" id="saveForm">Simpan</button><button class="btn secondary" id="cancelForm">Batal</button></div>`);$('#saveForm').onclick=()=>{let d={id:item?.id||uid(),name:$('#fName').value.trim(),balance:Number($('#fBalance').value),rate:Number($('#fRate').value)||0,minimum:Number($('#fMin').value)||0,due:$('#fDue').value,paid:item?.paid||0};if(!d.name||d.balance<0)return toast('Periksa data utang.');if(item)state.debts=state.debts.map(x=>x.id===item.id?d:x);else state.debts.push(d);save();closeModal();render();toast('Data utang tersimpan.')};$('#cancelForm').onclick=closeModal}

function editNameList(which,index){let arr=state[which],old=arr[index];openModal('Ubah nama',`${field('Nama','fName','text',old)}<div class="actions"><button class="btn" id="saveForm">Simpan</button><button class="btn secondary" id="cancelForm">Batal</button></div>`);$('#saveForm').onclick=()=>{let v=$('#fName').value.trim();if(!v)return toast('Nama tidak boleh kosong.');state[which][index]=v;save();closeModal();render()};$('#cancelForm').onclick=closeModal}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;document.body.classList.remove('mobile-open');$('#overlay').classList.remove('show');render();return}let a=e.target.closest('[data-action]');if(!a)return;let act=a.dataset.action;
if(act==='addTransaction')transactionModal();else if(act==='addIncome')transactionModal('income');else if(act==='addExpense')transactionModal('expense');else if(act==='addDebt')debtModal();else if(act==='addPlan')planModal();else if(act==='addEvent')eventModal();else if(act==='prevMonth'){calendarDate.setMonth(calendarDate.getMonth()-1);render()}else if(act==='nextMonth'){calendarDate.setMonth(calendarDate.getMonth()+1);render()}else if(act.startsWith('edit:'))transactionModal(null,state.transactions.find(x=>x.id==act.split(':')[1]));else if(act.startsWith('deleteTransaction:')){let id=Number(act.split(':')[1]);if(confirm('Hapus transaksi ini?')){state.transactions=state.transactions.filter(x=>x.id!==id);save();render()}}else if(act.startsWith('editDebt:'))debtModal(state.debts.find(x=>x.id==act.split(':')[1]));else if(act.startsWith('deleteDebt:')){if(confirm('Hapus data utang?')){state.debts=state.debts.filter(x=>x.id!=act.split(':')[1]);save();render()}}else if(act.startsWith('payDebt:'))payDebt(Number(act.split(':')[1]));else if(act.startsWith('editPlan:'))planModal(state.plans.find(x=>x.id==act.split(':')[1]));else if(act.startsWith('deletePlan:')){state.plans=state.plans.filter(x=>x.id!=act.split(':')[1]);save();render()}else if(act.startsWith('realize:')){let p=state.plans.find(x=>x.id==act.split(':')[1]);if(p){if(p.date>today()){toast('Belum bisa direalisasikan. Tanggal rencana belum tiba.');return}state.transactions.push({id:uid(),name:p.name,type:p.type,category:p.category||'Realisasi rencana',amount:p.amount,date:today(),status:p.type==='income'?'Diterima':'Dibayar'});p.status=p.type==='income'?'Diterima':'Dibayar';save();render();toast('Rencana direalisasikan menjadi transaksi aktual.')}}else if(act==='saveTargets'){state.savings=Number($('#savingsInput').value)||0;state.savingTarget=Number($('#targetInput').value)||0;state.savingPercent=Number($('#percentInput').value)||0;save();render();toast('Target tabungan disimpan.')}else if(act==='saveOpening'){state.openingBalance=Number($('#openingInput').value)||0;save();render();toast('Saldo awal disimpan.')}else if(act==='addSource'||act==='addCategory'){let which=act==='addSource'?'sources':'categories';openModal('Tambah '+(which==='sources'?'sumber pemasukan':'kategori'),`${field('Nama','fName')}<button class="btn" id="saveForm">Tambah</button>`);$('#saveForm').onclick=()=>{let v=$('#fName').value.trim();if(v){state[which].push(v);save();closeModal();render()}}}else if(act.startsWith('editSource:'))editNameList('sources',Number(act.split(':')[1]));else if(act.startsWith('editCategory:'))editNameList('categories',Number(act.split(':')[1]));else if(act.startsWith('deleteSource:')||act.startsWith('deleteCategory:')){let [kind,index]=act.split(':');let which=kind==='deleteSource'?'sources':'categories';if(confirm('Hapus pilihan ini?')){state[which].splice(Number(index),1);save();render()}}else if(act==='export'){let blob=new Blob([['Tanggal,Nama,Jenis,Kategori,Nominal',...state.transactions.map(x=>[x.date,x.name,x.type,x.category,x.amount].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','))].join('\n')],{type:'text/csv'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='amal-finance-transaksi.csv';link.click();URL.revokeObjectURL(url)}
});
$('#menuBtn').onclick=()=>{if(innerWidth<=700){document.body.classList.toggle('mobile-open');$('#overlay').classList.toggle('show')}else document.body.classList.toggle('collapsed')};$('#overlay').onclick=()=>{document.body.classList.remove('mobile-open');$('#overlay').classList.remove('show')};$('#closeModal').onclick=closeModal;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};
document.addEventListener('change',e=>{if(e.target.id==='dashboardMonth'){dashboardMonth=e.target.value||today().slice(0,7);if(dashboardMonth<today().slice(0,7))dashboardMonth=today().slice(0,7);render()}});
document.addEventListener('input',e=>{if(e.target.id==='percentInput')$('#percentLabel').textContent=e.target.value+'%'});
render();
</script></body></html>
